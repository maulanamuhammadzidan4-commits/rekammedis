<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Doctor LogIn</title>
    <link rel="stylesheet" href="../../assets/css/dokter/style.css">
</head>
<body>
    <div class="login-card">
        <div class="input-group">
            <label for="doctorname">Nama Dokter</label>
            <input type="text" id="doctorname" name="doctorname" placeholder="Masukkan nama." required>
        </div>
        <div class="input-group">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="Masukkan kata sandi." required>
        </div>
        <button onclick="login()" class="submit-btn">Log-in</button>
        <script src="../../assets/js/dokter/script.js"></script>
    </div>
</body>
</html>
